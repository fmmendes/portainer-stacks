listen 1935;
max_connections 100;
daemon off;
pid /tmp/srs.pid;
srs_log_tank console;

http_api {
    enabled on;
    listen 8080;
}

vhost __defaultVhost__ {
    http_hooks {
        enabled on;
        on_publish http://srs-recorder:9001/publish;
    }

    forward {
        enabled on;
        destination srs-ffmpeg:1936;
    }

    dvr {
        enabled ${RTMP_RECORD_ENABLED};
        dvr_plan segment;
        dvr_path ${RTMP_RECORD_PATH}/native/[app]/[stream].[timestamp].flv;
        dvr_duration ${RTMP_SEGMENT_SECONDS};
        dvr_wait_keyframe on;
        time_jitter full;
    }
}
