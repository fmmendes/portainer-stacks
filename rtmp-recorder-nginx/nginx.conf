worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr info;

events {
    worker_connections 1024;
}

rtmp {
    server {
        listen 1935;
        chunk_size 4096;

        application ${RTMP_APP_NAME} {
            live on;
            record ${RTMP_RECORD_ENABLED};
            record_path ${RTMP_RECORD_PATH};
            record_unique ${RTMP_RECORD_UNIQUE};
            record_suffix -%Y%m%dT%H%M%S.flv;
            record_interval ${RTMP_SEGMENT_MINUTES}m;

            on_publish http://nginx-recorder:9001/publish;
            push rtmp://nginx-ffmpeg:1936/${RTMP_APP_NAME}/${RTMP_STREAM_NAME};
            push_reconnect 1s;
        }
    }
}

http {
    access_log /dev/stdout;
    server_tokens off;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;

    server {
        listen 8080;

        location = / {
            return 302 /stat;
        }

        location = /stat {
            rtmp_stat all;
        }

        location = /health {
            access_log off;
            return 200 "ok\n";
        }
    }
}
